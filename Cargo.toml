[package]
name = "vibecode-cli"
version = "0.1.6"
edition = "2021"
description = "VibeCode Agentic CLI"
license = "MIT"

[[bin]]
name = "vibecode-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["bracketed-paste"] }
dirs = "6"
futures-util = "0.3"
libc = "0.2"
pulldown-cmark = "0.13"
portable-pty = "0.9"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = "5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
urlencoding = "2"
aws-config = "1.8.16"
aws-sdk-bedrockruntime = "1.130.0"
aws-credential-types = "1.2.14"
aws-types = "1.3.15"
aws-smithy-types = "1.4.8"
