<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board &middot; Yolomancer</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0d1117;
  --surface:   #161b22;
  --surface2:  #1c2128;
  --border:    #30363d;
  --border-hl: #484f58;
  --text:      #c9d1d9;
  --text-dim:  #8b949e;
  --text-bright: #f0f3f6;
  --accent:    #58a6ff;
  --accent-dim:#1f6feb;
  --green:     #3fb950;
  --orange:    #d29922;
  --red:       #f85149;
  --purple:    #bc8cff;
  --mono:      'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
  --sans:      -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --radius:    6px;
}

html, body { height: 100%; }
body {
  font: 14px/1.5 var(--sans);
  color: var(--text);
  background: var(--bg);
  display: grid;
  grid-template-rows: auto 1fr;
  grid-template-columns: 1fr 420px;
  overflow: hidden;
}

/* ── Header ─────────────────────────────────────────── */
header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
header h1 {
  font: 600 16px var(--mono);
  color: var(--text-bright);
  letter-spacing: -0.5px;
}
header h1 span { color: var(--accent); }
.header-status {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
  font: 12px var(--mono);
  color: var(--text-dim);
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text-dim);
  transition: background .3s;
}
.status-dot.ok { background: var(--green); }
.status-dot.err { background: var(--red); }
.refresh-btn {
  display: grid;
  place-items: center;
  width: 32px; height: 32px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-dim);
  cursor: pointer;
  transition: all .15s;
}
.refresh-btn:hover { border-color: var(--border-hl); color: var(--text); }
.refresh-btn.spin svg { animation: spin .6s ease; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Board ──────────────────────────────────────────── */
.board {
  overflow-x: auto;
  overflow-y: hidden;
  padding: 20px;
  display: flex;
  gap: 12px;
}
.lane {
  flex: 0 0 220px;
  min-width: 220px;
  display: flex;
  flex-direction: column;
  max-height: 100%;
}
.lane-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  font: 600 11px/1 var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius) var(--radius) 0 0;
}
.lane-count {
  display: inline-grid;
  place-items: center;
  min-width: 20px; height: 20px;
  padding: 0 6px;
  font-size: 11px;
  border-radius: 10px;
  background: var(--surface2);
  color: var(--text-dim);
}
.lane-body {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.lane-body:empty::after {
  content: 'No stories';
  display: block;
  padding: 16px 8px;
  text-align: center;
  font: 12px var(--sans);
  color: var(--text-dim);
  opacity: .5;
}

/* ── Story Card ─────────────────────────────────────── */
.card {
  padding: 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
}
.card:hover {
  border-color: var(--border-hl);
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent-dim);
}
.card-id {
  font: 11px var(--mono);
  color: var(--text-dim);
}
.card-title {
  font: 13px/1.35 var(--sans);
  color: var(--text-bright);
  margin-top: 2px;
  word-break: break-word;
}
.card-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
  font: 11px var(--mono);
  color: var(--text-dim);
}
.card-assignee {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 1px 6px;
  background: var(--accent-dim);
  color: var(--accent);
  border-radius: 10px;
  font-size: 10px;
}

/* ── Chat Panel ─────────────────────────────────────── */
.chat-panel {
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--border);
  background: var(--surface);
  overflow: hidden;
}
.chat-header {
  padding: 12px 16px;
  font: 600 13px var(--mono);
  color: var(--text-bright);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.chat-header svg { flex-shrink: 0; }
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.msg {
  max-width: 92%;
  padding: 10px 14px;
  border-radius: 12px;
  font: 13px/1.5 var(--sans);
  word-break: break-word;
}
.msg pre {
  margin: 6px 0 2px;
  padding: 8px;
  background: rgba(0,0,0,.3);
  border-radius: 4px;
  overflow-x: auto;
  font: 12px/1.4 var(--mono);
  white-space: pre-wrap;
}
.msg code {
  padding: 1px 5px;
  background: rgba(0,0,0,.25);
  border-radius: 3px;
  font: 12px var(--mono);
}
.msg-user {
  align-self: flex-end;
  background: var(--accent-dim);
  color: var(--text-bright);
  border-bottom-right-radius: 4px;
}
.msg-assistant {
  align-self: flex-start;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-bottom-left-radius: 4px;
}
.msg-system {
  align-self: center;
  font: 11px var(--mono);
  color: var(--text-dim);
  background: none;
  padding: 4px 0;
}
.msg-tool {
  align-self: flex-start;
  font: 11px var(--mono);
  color: var(--orange);
  background: rgba(210,153,34,.08);
  border: 1px solid rgba(210,153,34,.2);
  border-radius: 6px;
  padding: 6px 10px;
  max-width: 92%;
}
.msg-tool .tool-name { font-weight: 600; }
.msg-reasoning {
  align-self: flex-start;
  font: 11px/1.4 var(--sans);
  color: var(--purple);
  background: rgba(188,140,255,.06);
  border-left: 2px solid var(--purple);
  padding: 6px 10px;
  max-width: 92%;
  opacity: .7;
}
.typing-indicator {
  display: none;
  align-self: flex-start;
  padding: 10px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  border-bottom-left-radius: 4px;
}
.typing-indicator.active { display: block; }
.typing-dots { display: flex; gap: 4px; }
.typing-dots span {
  width: 6px; height: 6px;
  background: var(--text-dim);
  border-radius: 50%;
  animation: blink 1.4s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: .2s; }
.typing-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100%{opacity:.3} 40%{opacity:1} }

/* ── Input ──────────────────────────────────────────── */
.chat-input-wrap {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}
.chat-input-row {
  display: flex;
  gap: 8px;
}
.chat-input {
  flex: 1;
  min-height: 40px;
  max-height: 120px;
  padding: 8px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font: 13px var(--sans);
  resize: none;
  outline: none;
  transition: border-color .15s;
}
.chat-input:focus { border-color: var(--accent); }
.chat-input::placeholder { color: var(--text-dim); }
.send-btn {
  width: 40px; height: 40px;
  display: grid;
  place-items: center;
  background: var(--accent-dim);
  border: none;
  border-radius: var(--radius);
  color: var(--accent);
  cursor: pointer;
  transition: background .15s;
}
.send-btn:hover { background: var(--accent); color: var(--bg); }
.send-btn:disabled { opacity: .3; cursor: not-allowed; }
.quick-actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.quick-btn {
  padding: 4px 10px;
  font: 11px var(--mono);
  color: var(--text-dim);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.quick-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Detail Drawer ──────────────────────────────────── */
.detail-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.5);
}
.detail-overlay.open { display: flex; align-items: center; justify-content: center; }
.detail-panel {
  width: min(580px, 90vw);
  max-height: 80vh;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow-y: auto;
  padding: 24px;
}
.detail-panel h2 {
  font: 600 18px var(--sans);
  color: var(--text-bright);
  margin-bottom: 4px;
}
.detail-field {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  font: 13px var(--sans);
}
.detail-label {
  flex: 0 0 80px;
  font: 600 12px var(--mono);
  color: var(--text-dim);
  text-transform: uppercase;
  padding-top: 2px;
}
.detail-value { color: var(--text); flex: 1; }
.detail-body {
  margin-top: 16px;
  padding: 12px;
  background: var(--bg);
  border-radius: var(--radius);
  font: 13px/1.6 var(--sans);
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-word;
}
.detail-close {
  float: right;
  width: 32px; height: 32px;
  display: grid;
  place-items: center;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-dim);
  cursor: pointer;
  font-size: 18px;
}
.detail-close:hover { color: var(--text); border-color: var(--border-hl); }
.detail-comments { margin-top: 16px; }
.detail-comments h3 {
  font: 600 12px var(--mono);
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.comment {
  padding: 8px 10px;
  margin-bottom: 6px;
  background: var(--bg);
  border-radius: var(--radius);
  font: 12px/1.5 var(--sans);
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-word;
}

/* ── Lane colours ───────────────────────────────────── */
.lane[data-lane="backlog"] .lane-header { border-top: 2px solid var(--text-dim); }
.lane[data-lane="ready"]   .lane-header { border-top: 2px solid var(--accent); }
.lane[data-lane="doing"]   .lane-header { border-top: 2px solid var(--orange); }
.lane[data-lane="review"]  .lane-header { border-top: 2px solid var(--purple); }
.lane[data-lane="done"]    .lane-header { border-top: 2px solid var(--green); }

/* ── Scrollbar ──────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-hl); }

/* ── Empty state ────────────────────────────────────── */
.empty-board {
  grid-column: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--text-dim);
  font: 14px var(--sans);
  text-align: center;
  padding: 40px;
}
.empty-board svg { opacity: .3; }

/* ── Responsive ─────────────────────────────────────── */
@media (max-width: 900px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto 1fr 1fr; }
  .chat-panel { border-left: none; border-top: 1px solid var(--border); }
}
</style>
</head>
<body>

<header>
  <h1><span>&gt;</span> yolomancer <span>board</span></h1>
  <button class="refresh-btn" id="refreshBtn" title="Refresh board">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 2.5v4h-4"/><path d="M2.5 13.5v-4h4"/><path d="M3.2 6a5.5 5.5 0 019.3-.5m.3 4.5a5.5 5.5 0 01-9.3.5"/></svg>
  </button>
  <div class="header-status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">checking...</span>
  </div>
</header>

<div class="board" id="board"></div>

<div class="chat-panel">
  <div class="chat-header">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1C4.134 1 1 3.582 1 6.75c0 1.77 1.025 3.35 2.633 4.378A5.7 5.7 0 012.5 13.5a.5.5 0 00.7.5 7.2 7.2 0 003.5-1.75c.42.05.85.075 1.3.075 3.866 0 7-2.582 7-5.575S11.866 1 8 1z"/></svg>
    Agent Chat
  </div>
  <div class="chat-messages" id="chatMessages">
    <div class="msg msg-system">Ask the agent about board stories, codebase status, or anything else.</div>
  </div>
  <div class="chat-input-wrap">
    <div class="chat-input-row">
      <textarea class="chat-input" id="chatInput" placeholder="Ask about the board, stories, code..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="quick-actions">
      <button class="quick-btn" data-prompt="List all stories on the board and summarise their status">Board overview</button>
      <button class="quick-btn" data-prompt="What stories are currently in progress (doing lane)?">In progress</button>
      <button class="quick-btn" data-prompt="Are there any blocked or stale stories? Check for issues.">Blocked stories</button>
      <button class="quick-btn" data-prompt="Check the codebase for recent changes and summarise the project status">Code status</button>
      <button class="quick-btn" data-prompt="What is the overall project health? Check board and code.">Project health</button>
    </div>
  </div>
</div>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-panel" id="detailPanel"></div>
</div>

<script>
// ── State ────────────────────────────────────────────
const LANES = ['backlog', 'ready', 'doing', 'review', 'done'];
let boardData = { stories: [] };
let running = false;

// ── DOM refs ─────────────────────────────────────────
const boardEl      = document.getElementById('board');
const chatMessages = document.getElementById('chatMessages');
const chatInput    = document.getElementById('chatInput');
const sendBtn      = document.getElementById('sendBtn');
const refreshBtn   = document.getElementById('refreshBtn');
const statusDot    = document.getElementById('statusDot');
const statusText   = document.getElementById('statusText');
const detailOverlay= document.getElementById('detailOverlay');
const detailPanel  = document.getElementById('detailPanel');

// ── Health check ─────────────────────────────────────
async function checkHealth() {
  try {
    const r = await fetch('/api/healthz');
    const d = await r.json();
    if (d.ok) {
      statusDot.className = 'status-dot ok';
      statusText.textContent = 'api connected';
    } else throw 0;
  } catch {
    statusDot.className = 'status-dot err';
    statusText.textContent = 'api offline';
  }
}

// ── Board rendering ──────────────────────────────────
function renderBoard() {
  boardEl.innerHTML = '';
  if (!boardData.stories || boardData.stories.length === 0) {
    boardEl.innerHTML = `
      <div class="empty-board" style="width:100%">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor" opacity=".2"><path d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm0 16H5V5h14v14zM7 7h2v2H7zm0 4h2v2H7zm0 4h2v2H7zm4-8h6v2h-6zm0 4h6v2h-6zm0 4h6v2h-6z"/></svg>
        <div>Board is empty</div>
        <div style="font-size:12px;opacity:.6">Use the chat to ask the agent to create stories, or manage them from the CLI.</div>
      </div>`;
    return;
  }

  const byLane = {};
  LANES.forEach(l => byLane[l] = []);
  boardData.stories.forEach(s => {
    if (byLane[s.lane]) byLane[s.lane].push(s);
  });

  LANES.forEach(lane => {
    const stories = byLane[lane];
    const col = document.createElement('div');
    col.className = 'lane';
    col.dataset.lane = lane;

    col.innerHTML = `
      <div class="lane-header">
        ${lane} <span class="lane-count">${stories.length}</span>
      </div>
      <div class="lane-body">
        ${stories.map(s => `
          <div class="card" data-id="${s.id}" onclick="openDetail(${s.id})">
            <div class="card-id">#${s.id}</div>
            <div class="card-title">${esc(s.title)}</div>
            <div class="card-meta">
              ${s.assignee ? `<span class="card-assignee">@${esc(s.assignee)}</span>` : ''}
            </div>
          </div>
        `).join('')}
      </div>`;
    boardEl.appendChild(col);
  });
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ── Fetch board data ─────────────────────────────────
async function loadBoard() {
  refreshBtn.classList.add('spin');
  setTimeout(() => refreshBtn.classList.remove('spin'), 600);
  try {
    // Ask the agent to list the board
    const r = await runAgent('List all stories on the board. Return the raw board data. Use the board tool with op "list".');
    // Try to parse board data from the response
    if (r && r._boardData) {
      boardData = r._boardData;
    }
  } catch(e) {
    console.error('Board load error:', e);
  }
  renderBoard();
}

// ── Detail view ──────────────────────────────────────
function openDetail(id) {
  const story = boardData.stories.find(s => s.id === id);
  if (!story) return;

  detailPanel.innerHTML = `
    <button class="detail-close" onclick="closeDetail()">&times;</button>
    <div class="card-id" style="margin-bottom:4px">#${story.id} &middot; v${story.version || '?'}</div>
    <h2>${esc(story.title)}</h2>
    <div class="detail-field">
      <div class="detail-label">Lane</div>
      <div class="detail-value">${story.lane}</div>
    </div>
    <div class="detail-field">
      <div class="detail-label">Assignee</div>
      <div class="detail-value">${story.assignee ? '@' + esc(story.assignee) : '<span style="color:var(--text-dim)">unassigned</span>'}</div>
    </div>
    ${story.body ? `<div class="detail-body">${esc(story.body)}</div>` : ''}
    ${story.comments && story.comments.length ? `
      <div class="detail-comments">
        <h3>Comments (${story.comments.length})</h3>
        ${story.comments.map(c => `<div class="comment">${esc(typeof c === 'string' ? c : c.body || JSON.stringify(c))}</div>`).join('')}
      </div>
    ` : ''}
    <div style="margin-top:16px">
      <button class="quick-btn" onclick="askAboutStory(${story.id})" style="font-size:12px;padding:6px 14px">
        Ask agent about this story
      </button>
    </div>
  `;
  detailOverlay.classList.add('open');
}

function closeDetail() {
  detailOverlay.classList.remove('open');
}
detailOverlay.addEventListener('click', e => { if (e.target === detailOverlay) closeDetail(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

function askAboutStory(id) {
  closeDetail();
  const story = boardData.stories.find(s => s.id === id);
  if (!story) return;
  chatInput.value = `Tell me about story #${id}: "${story.title}". What is its status? Is there related code?`;
  chatInput.focus();
}

// ── Chat / SSE agent interaction ─────────────────────
function addMessage(type, html) {
  const div = document.createElement('div');
  div.className = `msg msg-${type}`;
  div.innerHTML = html;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return div;
}

function formatAssistantText(text) {
  // Minimal markdown: code blocks, inline code, bold
  let h = esc(text);
  // Code blocks
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // Newlines
  h = h.replace(/\n/g, '<br>');
  return h;
}

async function runAgent(prompt, silent) {
  if (running) return;
  running = true;
  sendBtn.disabled = true;

  if (!silent) {
    addMessage('user', esc(prompt));
  }

  let assistantEl = null;
  let fullText = '';
  let hadStreamedText = false;
  let reasoningEl = null;
  let result = {};

  const typingEl = document.createElement('div');
  typingEl.className = 'typing-indicator active';
  typingEl.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  chatMessages.appendChild(typingEl);
  chatMessages.scrollTop = chatMessages.scrollHeight;

  try {
    const resp = await fetch('/api/v1/runs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ agent: 'workshop', prompt })
    });

    if (!resp.ok) {
      throw new Error(`API error: ${resp.status}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let evt;
        try { evt = JSON.parse(line.slice(6)); } catch { continue; }

        switch (evt.type) {
          case 'assistant.delta':
            typingEl.classList.remove('active');
            reasoningEl = null; // new reasoning block for next thinking phase
            if (!assistantEl) {
              assistantEl = addMessage('assistant', '');
            }
            fullText += evt.data.text;
            assistantEl.innerHTML = formatAssistantText(fullText);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            break;

          case 'assistant.message':
            typingEl.classList.remove('active');
            if (!assistantEl) {
              assistantEl = addMessage('assistant', '');
            }
            fullText = evt.data.text || fullText;
            assistantEl.innerHTML = formatAssistantText(fullText);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            break;

          case 'assistant.done':
            // Mark that streamed text was already rendered
            if (fullText) hadStreamedText = true;
            // Reset for next assistant turn in same run
            assistantEl = null;
            fullText = '';
            reasoningEl = null;
            break;

          case 'tool.started':
            reasoningEl = null;
            addMessage('tool', `<span class="tool-name">${esc(evt.data.name)}</span> called`);
            break;

          case 'tool.completed':
            if (evt.data.name === 'board') {
              try {
                // result may be a string or already parsed object
                let res = evt.data.result;
                if (typeof res === 'string') res = JSON.parse(res);
                // Navigate nested structure: {ok, result: {lanes, stories}}
                const inner = res.result || res;
                if (inner.stories) {
                  boardData = inner;
                  renderBoard();
                  result._boardData = inner;
                }
              } catch(e) { console.log('board parse:', e); }
            }
            break;

          case 'reasoning.delta':
            // Append to current reasoning block, or create one
            if (!reasoningEl) {
              reasoningEl = document.createElement('div');
              reasoningEl.className = 'msg msg-reasoning';
              reasoningEl.textContent = '';
              chatMessages.insertBefore(reasoningEl, typingEl);
            }
            reasoningEl.textContent += evt.data.text;
            chatMessages.scrollTop = chatMessages.scrollHeight;
            break;

          case 'run.completed':
            // Only add final text if we never rendered it via streaming deltas
            if (evt.data && evt.data.text && !assistantEl && !hadStreamedText) {
              addMessage('assistant', formatAssistantText(evt.data.text));
            }
            break;

          case 'run.failed':
            addMessage('system', 'Run failed: ' + esc(evt.data?.message || 'unknown error'));
            break;

          case 'run.blocked':
            addMessage('system', 'Run blocked: ' + esc(evt.data?.explanation || 'permission denied'));
            break;

          case 'run.cancelled':
            addMessage('system', 'Run cancelled');
            break;
        }
      }
    }
  } catch (err) {
    addMessage('system', 'Error: ' + esc(err.message));
  } finally {
    typingEl.remove();
    running = false;
    sendBtn.disabled = false;
  }

  return result;
}

// ── Input handling ───────────────────────────────────
function sendMessage() {
  const text = chatInput.value.trim();
  if (!text || running) return;
  chatInput.value = '';
  chatInput.style.height = 'auto';
  runAgent(text);
}

sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
});

document.querySelectorAll('.quick-btn[data-prompt]').forEach(btn => {
  btn.addEventListener('click', () => {
    if (running) return;
    chatInput.value = btn.dataset.prompt;
    sendMessage();
  });
});

refreshBtn.addEventListener('click', () => {
  if (running) return;
  loadBoard();
});

// ── Initial load ─────────────────────────────────────
checkHealth();
setInterval(checkHealth, 30000);

// Try a direct board fetch first via the agent
(async () => {
  // Simple initial board load via agent
  renderBoard(); // Show empty state
  await loadBoard();
})();
</script>
